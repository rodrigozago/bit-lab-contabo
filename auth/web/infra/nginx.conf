server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/* (inclui /api/me, /api/my-access) e /admin/api/* vão pro backend —
    # tudo sai do mesmo host/origem do navegador, sem CORS. Login/signup
    # continuam vanilla, servidos direto por auth.bit-lab.tech (ver lib/auth.ts).
    location /api/ {
        proxy_pass http://auth:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/api/ {
        proxy_pass http://auth:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # avatares de perfil (ver src/media.js no backend) — servidos pelo auth,
    # não pela SPA.
    location /media/ {
        proxy_pass http://auth:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
