services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bitlab_auth
      POSTGRES_USER: bitlab_auth
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitlab_auth"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - auth
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://bitlab_auth:${POSTGRES_PASSWORD}@postgres:5432/bitlab_auth"
      REDIS_URL: "redis://redis:6379"
      ISSUER: "https://auth.bit-lab.tech"
      COOKIE_DOMAIN: ".bit-lab.tech"
      SESSION_SECRET: "${SESSION_SECRET}"
      INITIAL_ADMIN_EMAIL: "${INITIAL_ADMIN_EMAIL}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD}"
      FACE_LAB_OIDC_SECRET: "${FACE_LAB_OIDC_SECRET}"
      PONTO_STUDIO_OIDC_SECRET: "${PONTO_STUDIO_OIDC_SECRET}"
      SENTINELA_OIDC_SECRET: "${SENTINELA_OIDC_SECRET}"
      ROLLBAR_SERVER_TOKEN: "${ROLLBAR_SERVER_TOKEN:-}"
      JWKS_PATH: "/app/data/jwks.json"
      NODE_ENV: production
      PORT: "4000"
    ports:
      # nginx da VPS faz proxy_pass pra cá (auth.bit-lab.tech) — só loopback
      - "127.0.0.1:4002:4000"
    volumes:
      - jwks:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auth

  web:
    build: ./web
    restart: unless-stopped
    ports:
      # nginx da VPS faz proxy_pass pra cá (apps.bit-lab.tech) — só loopback.
      # 4003 já é do face-lab-api; 3006 segue o padrão de portas 3xxx pros
      # frontends/web (3002 studio, 3003 ponto, 3004 face, 3005 on-air).
      - "127.0.0.1:3006:80"
    depends_on:
      - auth
    networks:
      - auth

volumes:
  pgdata:
  jwks:

networks:
  auth:
    driver: bridge
