# Nextcloud - cloud.bit-lab.tech
# Fica atrás do Cloudflare proxy (nuvem laranja), igual o resto de *.bit-lab.tech
# — usa o mesmo Origin Certificate wildcard (só a Cloudflare valida esse cert,
# então só funciona com o registro DNS proxied).
server {
    listen 80;
    listen [::]:80;
    server_name cloud.bit-lab.tech;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cloud.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

# Modoboa - mail.bit-lab.tech
# ATENÇÃO: este registro DNS precisa ser "DNS only" (nuvem cinza) na
# Cloudflare — SMTP/IMAP (portas 25/587/993/143, ver docker-compose.yml) nunca
# passam pelo proxy dela, então o servidor de e-mail precisa do IP real
# exposto. Por isso NÃO dá pra usar o Origin Certificate aqui (só a Cloudflare
# confia nele — sem o proxy no meio, o navegador do usuário veria "não
# confiável"): certificado é Let's Encrypt de verdade, específico deste host
# (ver README.md seção 2.1 pro comando certbot).
server {
    listen 80;
    listen [::]:80;
    server_name mail.bit-lab.tech;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.bit-lab.tech;

    ssl_certificate /etc/letsencrypt/live/mail.bit-lab.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.bit-lab.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
