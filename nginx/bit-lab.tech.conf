server {
    listen 80;
    server_name bit-lab.tech www.bit-lab.tech studio.bit-lab.tech auth.bit-lab.tech apps.bit-lab.tech face.bit-lab.tech on-air.bit-lab.tech sentinela.bit-lab.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bit-lab.tech www.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    root /var/www/bit-lab.tech;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /opencdj {
        alias /var/www/opencdj;
        try_files $uri $uri/ /opencdj/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name studio.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    # página pública de preços — estática, servida direto pelo nginx,
    # não passa pelo proxy do ponto-studio (3002) então fica fora do SSO
    location /precos {
        alias /var/www/bit-lab.tech/precos;
        try_files $uri $uri/ /precos/index.html;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name auth.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # oidc-provider precisa saber que a borda é https (issuer/redirects corretos)
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name apps.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    # Portal central (dashboard + admin) — SPA em auth/web, container próprio
    # que já faz proxy interno de /api e /admin/api pro serviço `auth` (4002).
    # auth.bit-lab.tech continua existindo à parte: é o ISSUER do OIDC e onde
    # vivem /login, /signup, /interaction/:uid — não precisou mudar.
    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name on-air.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    # upload de foto do artista — o Fastify aceita até 10MB
    client_max_body_size 12m;

    # SSO desligado por enquanto — /admin protegido por senha simples no app
    # (header x-admin-key, ver on-air/apps/api/src/routes/admin.ts). Pra religar
    # o gate do bit-lab-auth, copie o modelo do bloco em nginx/bordado.digital.conf
    # com /verify?app=on-air aplicado só em /admin e /api/admin/.
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name sentinela.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    # sem auth_request aqui: o sentinela faz OIDC completo contra o auth (BFF),
    # mesmo modelo do ponto-studio/face-lab — o próprio app controla acesso.
    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name face.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    # frames de webcam do enrollment (multipart com várias imagens)
    client_max_body_size 25m;

    # sem auth_request aqui: o face-lab faz OIDC completo contra o auth (BFF),
    # a landing é pública por design e os papéis guest/producer/admin são do app
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
