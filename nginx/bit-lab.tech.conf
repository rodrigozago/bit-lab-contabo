server {
    listen 80;
    server_name bit-lab.tech www.bit-lab.tech studio.bit-lab.tech ponto.bit-lab.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bit-lab.tech www.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    root /var/www/bit-lab.tech;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /opencdj {
        alias /var/www/opencdj;
        try_files $uri $uri/ /opencdj/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name studio.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name ponto.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    # upload de imagem (análise IA) — o Fastify aceita até 10MB
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # análise de imagem via IA pode demorar (LLM + imagem)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
