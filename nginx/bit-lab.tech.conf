server {
    listen 80;
    server_name bit-lab.tech www.bit-lab.tech studio.bit-lab.tech ponto.bit-lab.tech auth.bit-lab.tech face.bit-lab.tech on-air.bit-lab.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bit-lab.tech www.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    root /var/www/bit-lab.tech;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /opencdj {
        alias /var/www/opencdj;
        try_files $uri $uri/ /opencdj/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name studio.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name auth.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # oidc-provider precisa saber que a borda é https (issuer/redirects corretos)
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name ponto.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    # upload de imagem (análise IA) — o Fastify aceita até 10MB
    client_max_body_size 12m;

    # gate do bit-lab-auth — ver bit-lab-agents/auth
    location = /_verify {
        internal;
        proxy_pass http://127.0.0.1:4002/verify?app=ponto-studio;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location @login_redirect {
        return 302 https://auth.bit-lab.tech/login?redirect=$scheme://$host$request_uri;
    }

    location @access_denied {
        return 403 "Acesso negado — fale com o admin do bit-lab-auth.";
    }

    location / {
        auth_request /_verify;
        auth_request_set $auth_user $upstream_http_x_user_email;
        error_page 401 = @login_redirect;
        error_page 403 = @access_denied;

        proxy_set_header X-User-Email $auth_user;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # análise de imagem via IA pode demorar (LLM + imagem)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    server_name on-air.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    # upload de foto do artista — o Fastify aceita até 10MB
    client_max_body_size 12m;

    # gate do bit-lab-auth — ver bit-lab-agents/auth
    location = /_verify {
        internal;
        proxy_pass http://127.0.0.1:4002/verify?app=on-air;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location @login_redirect {
        return 302 https://auth.bit-lab.tech/login?redirect=$scheme://$host$request_uri;
    }

    location @access_denied {
        return 403 "Acesso negado — fale com o admin do bit-lab-auth.";
    }

    # só o admin é gated — a página pública, /api/timetable e /api/media
    # caem no location / abaixo, sem auth
    location /admin {
        auth_request /_verify;
        auth_request_set $auth_user $upstream_http_x_user_email;
        error_page 401 = @login_redirect;
        error_page 403 = @access_denied;

        proxy_set_header X-User-Email $auth_user;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/admin/ {
        auth_request /_verify;
        auth_request_set $auth_user $upstream_http_x_user_email;
        # XHR com sessão expirada recebe este 302 — o SPA trata (web/src/api.ts)
        error_page 401 = @login_redirect;
        error_page 403 = @access_denied;

        proxy_set_header X-User-Email $auth_user;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name face.bit-lab.tech;

    ssl_certificate /etc/ssl/cloudflare/bit-lab.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bit-lab.tech.key;

    # frames de webcam do enrollment (multipart com várias imagens)
    client_max_body_size 25m;

    # sem auth_request aqui: o face-lab faz OIDC completo contra o auth (BFF),
    # a landing é pública por design e os papéis guest/producer/admin são do app
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
