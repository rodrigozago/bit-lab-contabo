server {
    listen 80;
    server_name bordado.digital www.bordado.digital;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bordado.digital www.bordado.digital;

    ssl_certificate /etc/ssl/cloudflare/bordado.digital.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bordado.digital.key;

    # upload de imagem — o Fastify aceita até 10MB
    client_max_body_size 12m;

    # SSO in-app (BFF OIDC): o próprio app controla acesso —
    # rotas /api/auth/* + gate no front — não duplica login com um gate nginx
    # grosso (que também impediria o /api/auth/callback de completar).
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # análise de imagem pode demorar (vetorização de imagens grandes)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
