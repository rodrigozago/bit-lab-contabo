services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_STORYBLOK_PUBLIC_TOKEN: ${NEXT_PUBLIC_STORYBLOK_PUBLIC_TOKEN}
    ports:
      - "127.0.0.1:3008:3000" # nginx da VPS (bit-lab.tech) proxya pra cá
    environment:
      STORYBLOK_PREVIEW_TOKEN: ${STORYBLOK_PREVIEW_TOKEN}
      NEXT_PUBLIC_STORYBLOK_PUBLIC_TOKEN: ${NEXT_PUBLIC_STORYBLOK_PUBLIC_TOKEN}
      STORYBLOK_PREVIEW_SECRET: ${STORYBLOK_PREVIEW_SECRET}
      STORYBLOK_WEBHOOK_SECRET: ${STORYBLOK_WEBHOOK_SECRET}
      STUDIO_OIDC_ISSUER: ${STUDIO_OIDC_ISSUER}
      STUDIO_OIDC_CLIENT_ID: ${STUDIO_OIDC_CLIENT_ID}
      STUDIO_OIDC_CLIENT_SECRET: ${STUDIO_OIDC_CLIENT_SECRET}
      STUDIO_SESSION_SECRET: ${STUDIO_SESSION_SECRET}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-https://studio.bit-lab.tech}
    networks: [website]
    restart: unless-stopped

networks:
  website:
    driver: bridge
