<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bit Lab - Admin Listening</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      background: #111;
      padding: 2rem;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 1.5rem;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 1rem;
      border: 1px solid #333;
      background: #000;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #ddd;
    }
    .status {
      margin-top: 1rem;
      font-size: 0.9rem;
      height: 1.2rem;
    }
    .success { color: #4caf50; }
    .error { color: #f44336; }
    .back {
      display: inline-block;
      margin-top: 1.5rem;
      color: #888;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Configurar Álbum</h1>
    <input type="text" id="album" placeholder="Nome do álbum">
    <input type="password" id="password" placeholder="Senha do admin">
    <button id="btn-save">Salvar</button>
    <div id="status" class="status"></div>
    <a href="/" class="back">Voltar para Player</a>
  </div>

  <script>
    const btn = document.getElementById('btn-save');
    const inputAlbum = document.getElementById('album');
    const inputPassword = document.getElementById('password');
    const statusDiv = document.getElementById('status');

    fetch('/api/listening')
      .then(res => res.json())
      .then(data => {
        if (data.album) inputAlbum.value = data.album;
      });

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      statusDiv.textContent = 'Salvando...';
      statusDiv.className = 'status';

      try {
        const res = await fetch('/api/listening', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            album: inputAlbum.value,
            password: inputPassword.value
          })
        });
        
        const data = await res.json();
        if (res.ok) {
          statusDiv.textContent = 'Salvo com sucesso!';
          statusDiv.className = 'status success';
        } else {
          statusDiv.textContent = data.error || 'Erro ao salvar';
          statusDiv.className = 'status error';
        }
      } catch (err) {
        statusDiv.textContent = 'Erro de conexão';
        statusDiv.className = 'status error';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
